[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "td3_cedule"
version = "0.1.0"
description = "TD3 — sélection dans les algorithmes génétiques et cédule de maintenance"
readme = "README.md"
requires-python = ">=3.8"

[project.optional-dependencies]
figures = ["matplotlib"]

[tool.setuptools]
packages = ["td3_cedule"]
package-dir = {"td3_cedule" = "."}

[tool.setuptools.package-data]
td3_cedule = ["figures/*.png", "sorties/*.txt"]
