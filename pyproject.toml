[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "td2"
version = "0.1.0"
description = "Recherche taboue et recuit simulé — exercices TD2"
readme = "README.md"
requires-python = ">=3.8"

[tool.setuptools]
packages = ["td2"]

[tool.setuptools.package-data]
td2 = ["*.png", "*.txt"]
